<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://go.bsky.app">
  <title>{%- block head_title -%}Waldmeister{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    /*
     * mu: keep in sync with src/config/brand-theme.ts and web/index.html.
     *   light bg #FFFFFF | dark bg #000000 | dim bg #1A1A1A
     */
    /* BRAND-GEN:colors start - generated from src/config/brand-colors.json by scripts/sync-brand-web.mjs (run `pnpm brand:sync-web`; do not hand-edit) */
    :root {
      --text: #212121;
      --background: #FFFFFF;
      --backgroundLight: #F7F7F2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: #F7F7F2;
        --background: #000000;
        --backgroundLight: #212121;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    html.theme--light,
    html.theme--light body,
    html.theme--light #root {
      background-color: #FFFFFF;
      --text: #212121;
      --background: #FFFFFF;
      --backgroundLight: #F7F7F2;
    }
    html.theme--dark,
    html.theme--dark body,
    html.theme--dark #root {
      color-scheme: dark;
      background-color: #000000;
      --text: #F7F7F2;
      --background: #000000;
      --backgroundLight: #212121;
    }
    html.theme--dim,
    html.theme--dim body,
    html.theme--dim #root {
      color-scheme: dark;
      background-color: #1A1A1A;
      --text: #F7F7F2;
      --background: #1A1A1A;
      --backgroundLight: #242424;
    }
    /* BRAND-GEN:colors end */
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <script>
    const theme = localStorage.getItem('ALF_THEME')
    if (theme) {
      document.documentElement.classList.add(`theme--${theme}`)
    }
  </script>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#2B9321">
  <!-- BRAND-GEN:theme-color start - brand-colors.json defaultAccent primary_500 (run `pnpm brand:sync-web`) -->
  <meta name="theme-color" content="#2B9321">
  <!-- BRAND-GEN:theme-color end -->
  <meta name="application-name" content="Waldmeister">
  <meta name="generator" content="bskyweb">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="Waldmeister">
  <meta property="og:logo" content="{{ favicon }}">
  <!-- BRAND-GEN:twitter-site start - brand-meta.json socialHandle, omitted when empty (run `pnpm brand:sync-web`) -->

  <!-- BRAND-GEN:twitter-site end -->
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="splash">
    <!-- mu 3D wordmark (keep in sync with BRAND_LOGO_3D / web/index.html) -->
    <!-- BRAND-GEN:splash start - generated from src/config/brand-logo.json + brand-colors.json by scripts/sync-brand-web.mjs (run `pnpm brand:sync-web`; do not hand-edit) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><path d="M0-3c-2.2-7-5.5-17-5.5-27S-3-46 0-49c3 3 5.5 9 5.5 19S2.2-10 0-3" id="b"/><mask id="a"><path fill="#fff" d="M-50-50H50V50H-50z"/><path d="M0-6v-36M4.243-4.243l25.455-25.455M6 0h36M4.243 4.243l25.455 25.455M0 6v36M-4.243 4.243l-25.455 25.455M-6 0h-36m37.757-4.243-25.455-25.455" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round"/><circle r="2"/></mask></defs><g fill="#2B9321" transform="translate(50 50)" mask="url(#a)"><use href="#b"/><use href="#b" transform="rotate(45)"/><use href="#b" transform="rotate(90)"/><use href="#b" transform="rotate(135)"/><use href="#b" transform="rotate(180)"/><use href="#b" transform="rotate(225)"/><use href="#b" transform="rotate(270)"/><use href="#b" transform="rotate(315)"/></g></svg>
    <!-- BRAND-GEN:splash end -->
  </div>
  <div id="root">
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about Waldmeister at <a href="https://waldmeister.eu">waldmeister.eu</a> and <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
